name: SNIES Monitor

on:
  schedule:
    - cron: '0 13 * * 1'   # 08:00 hora Colombia (UTC-5), lunes
  workflow_dispatch:

jobs:
  run-snies:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline
        env:
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASS:     ${{ secrets.SMTP_PASS }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: python scripts/run_snies.py

      - name: Commitear cambios
        run: |
          git config user.name  "snies-bot"
          git config user.email "snies-bot@uninorte.edu.co"
          git add data/ Programas/
          git diff --staged --quiet || git commit -m "snies: $(date +'%Y-%m-%d')"
          git push

      - name: Subir Excel a OneDrive
        env:
          MS_CLIENT_ID:     ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT_ID:     ${{ secrets.MS_TENANT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
        run: python scripts/upload_onedrive.py

      - name: Generar dashboard
        run: python docs/generar_dashboard.py

      - name: Publicar dashboard
        run: |
          git add docs/
          git diff --staged --quiet || git commit -m "dashboard: $(date +'%Y-%m-%d')"
          git push